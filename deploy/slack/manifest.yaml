# Replace factory.example.com with your public HTTPS Factory origin before import.
display_information:
  name: Factories
  description: Start workflows, review approvals, and follow delivery.
  background_color: "#202938"
features:
  bot_user:
    display_name: Factory
    always_online: false
  slash_commands:
    - command: /factory
      url: https://factory.example.com/hooks/slack
      description: Run a workflow with Factory
      usage_hint: Open the workflow form
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
settings:
  interactivity:
    is_enabled: true
    request_url: https://factory.example.com/hooks/slack/interactions
    message_menu_options_url: https://factory.example.com/hooks/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
